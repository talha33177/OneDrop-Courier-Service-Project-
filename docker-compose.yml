# The whole demo on one machine: SQL Server, the database deployed from nothing, and the app. Not for a live site:
# that is deploy/docker-compose.yml (Production, no demo data, HTTPS), described in Documentation/Deployment.md.
#
#   cp .env.example .env        # then choose a SQL Server password in .env (git-ignored)
#   docker compose up --build
#
# Open http://onedrop.localhost:5080 (demo logins in the README). The app runs as
# Development, so the demo data, the demo logins and the Dev pages (SMS inbox, payouts sent, webhooks received) are there.
# SQL Server is on localhost,14330 for your own queries. `docker compose down -v` deletes the data.
name: onedrop

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  database:
    build:
      context: .
      target: database
    command:
      - -ConnectionString
      - Server=sql,1433;Database=OneDrop;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true
    depends_on:
      sql:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seed__DemoData: "true"
      Seed__DemoActivity: "true"
      ConnectionStrings__Database: Server=sql,1433;Database=OneDrop;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true
    ports:
      - "5080:8080"
    volumes:
      - keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      database:
        condition: service_completed_successfully

volumes:
  sql-data:
  keys:
